<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <!-- ===== GRADIENTS ===== -->
    
    <!-- Ocean - Deep blue to cyan -->
    <radialGradient id="ocean" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <!-- Land - Vibrant green -->
    <radialGradient id="land" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </radialGradient>

    <!-- Atmosphere glow -->
    <radialGradient id="atmosphere" cx="50%" cy="50%" r="55%">
      <stop offset="70%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="85%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="95%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer glow -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="90%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Top shine -->
    <radialGradient id="shine" cx="35%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom shadow -->
    <radialGradient id="innerShadow" cx="60%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </radialGradient>

    <!-- ===== FILTERS ===== -->
    
    <!-- Drop shadow -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#0f766e" flood-opacity="0.35"/>
    </filter>

    <!-- Soft blur for clouds -->
    <filter id="cloudBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ===== OUTER GLOW ===== -->
  <circle cx="300" cy="300" r="250" fill="url(#outerGlow)"/>

  <!-- ===== ATMOSPHERE ===== -->
  <circle cx="300" cy="300" r="210" fill="url(#atmosphere)"/>

  <!-- ===== PLANET BODY ===== -->
  <circle cx="300" cy="300" r="180" fill="url(#ocean)" filter="url(#dropShadow)"/>

  <!-- ===== CONTINENTS ===== -->
  <g fill="url(#land)">
    <!-- North America -->
    <path d="
      M195 175
      c15-20 45-28 75-22
      c25 5 45 20 55 42
      c8 18 5 38-8 52
      c-15 16-38 24-62 22
      c-28-3-52-18-62-45
      c-8-22 0-42 2-49
      z
    " opacity="0.95"/>

    <!-- South America -->
    <path d="
      M220 295
      c12-15 32-20 50-12
      c16 7 28 22 32 40
      c5 22-2 45-18 60
      c-18 17-42 22-62 12
      c-18-9-28-28-25-50
      c3-20 15-38 23-50
      z
    " opacity="0.92"/>

    <!-- Europe -->
    <path d="
      M320 165
      c20-12 48-10 68 5
      c15 12 22 30 18 48
      c-5 20-22 35-42 40
      c-22 5-45-2-58-18
      c-12-15-10-38 2-55
      c8-12 10-18 12-20
      z
    " opacity="0.95"/>

    <!-- Africa -->
    <path d="
      M330 255
      c18-15 45-18 68-8
      c20 9 35 28 38 50
      c4 25-5 52-25 70
      c-22 20-52 25-78 15
      c-24-9-40-32-38-58
      c2-28 18-52 35-69
      z
    " opacity="0.93"/>

    <!-- Asia -->
    <path d="
      M385 180
      c25-8 55-2 75 18
      c16 16 22 40 15 62
      c-8 25-30 42-55 48
      c-28 7-58-2-75-25
      c-15-20-12-48 5-70
      c12-16 25-28 35-33
      z
    " opacity="0.94"/>

    <!-- Australia -->
    <path d="
      M420 355
      c15-10 38-8 52 5
      c12 12 15 30 8 45
      c-8 18-25 28-45 28
      c-18 0-35-12-40-30
      c-5-18 5-38 25-48
      z
    " opacity="0.92"/>

    <!-- Small islands -->
    <ellipse cx="175" cy="320" rx="12" ry="8" opacity="0.85"/>
    <ellipse cx="465" cy="280" rx="10" ry="6" opacity="0.85"/>
    <ellipse cx="280" cy="385" rx="8" ry="5" opacity="0.8"/>
  </g>

  <!-- ===== CLOUDS ===== -->
  <g fill="#ffffff" opacity="0.4" filter="url(#cloudBlur)">
    <ellipse cx="240" cy="200" rx="35" ry="12"/>
    <ellipse cx="380" cy="230" rx="28" ry="10"/>
    <ellipse cx="200" cy="340" rx="25" ry="8"/>
    <ellipse cx="420" cy="320" rx="30" ry="10"/>
    <ellipse cx="300" cy="160" rx="22" ry="8"/>
    <ellipse cx="340" cy="400" rx="20" ry="7"/>
  </g>

  <!-- ===== SHINE ===== -->
  <circle cx="300" cy="300" r="180" fill="url(#shine)"/>

  <!-- ===== INNER SHADOW ===== -->
  <circle cx="300" cy="300" r="180" fill="url(#innerShadow)"/>

  <!-- ===== ATMOSPHERE RING ===== -->
  <circle cx="300" cy="300" r="182" fill="none" stroke="url(#atmosphere)" stroke-width="8" opacity="0.5"/>

  <!-- ===== STARS ===== -->
  <g fill="#ffffff">
    <circle cx="95" cy="120" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="510" cy="95" r="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="450" r="2" opacity="0.65">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="480" r="1.5" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.85;0.55" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="280" r="1.8" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="280" r="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.95;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== LEAF DECORATION ===== -->
  <g transform="translate(505, 540) scale(0.7)" fill="#10b981" opacity="0.8">
    <path d="M0 0 C-5-15-2-35 15-45 C12-25 8-10 0 0 Z"/>
    <path d="M2 2 C15-8 35-5 45 10 C25 12 10 8 2 2 Z"/>
  </g>
</svg>
